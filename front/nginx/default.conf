# Configuration nginx du conteneur front (ADR 0017). Incluse dans le bloc « http » de l'image nginx-unprivileged.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Ne pas annoncer la version de nginx dans les en-têtes et les pages d'erreur.
    server_tokens off;

    # Compression des fichiers texte (les .js d'Angular se compressent d'environ 75 %).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_vary on;

    # DNS interne de Docker (127.0.0.11). Avec une VARIABLE dans proxy_pass, nginx résout « api » à chaque
    # requête (cache 10 s) au lieu d'une seule fois au démarrage : si le conteneur api est recréé avec une
    # autre adresse IP (docker compose up -d --build api), le front continue de fonctionner sans redémarrer.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    # Sonde de santé du conteneur (healthcheck de docker-compose.yml) : répond sans toucher à l'API.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Relais vers l'API : le navigateur ne voit qu'une origine (http://localhost:4200), donc pas de CORS.
    # proxy_pass avec une variable et sans chemin : l'URI d'origine (/api/events?page=2) est transmise telle quelle.
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    # Fichiers à empreinte (main-ABCD1234.js, chunk-Xy_9AbCd.js, styles-….css, media/…) : leur nom change à
    # chaque version, on peut donc les garder un an en cache sans risque de servir une ancienne version.
    # Regex entre guillemets : sans eux, nginx lirait les accolades de {8} comme le début d'un bloc.
    location ~* "^/(?:(?:main|polyfills|styles|chunk)-[A-Za-z0-9_-]{8}\.(?:js|css)|media/.+)$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html n'a pas d'empreinte : jamais en cache, sinon le navigateur garderait une ancienne liste de fichiers.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Repli de l'application monopage : /evenements/42 n'existe pas sur le disque, nginx renvoie index.html
    # et c'est le routeur Angular qui affiche la bonne page (sinon un F5 donnerait une 404 nginx).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
