# En-têtes de sécurité (ADR 0017), inclus dans CHAQUE bloc « location » qui définit ses propres add_header.
# Piège nginx : dès qu'une location contient un add_header, elle n'hérite plus d'AUCUN add_header du niveau
# « server ». D'où ce fichier inclus partout plutôt qu'un add_header unique au niveau server.

# CSP : seuls nos propres fichiers. style-src 'unsafe-inline' est requis par les styles des composants Angular ;
# script-src reste strict (aucun script en ligne : inlineCritical est désactivé dans angular.json).
# connect-src 'self' : l'API est appelée par le même nom de site (/api relayé par nginx).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
