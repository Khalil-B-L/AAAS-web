<!-- Pas de href="#contenu" seul : avec <base href="/">, l'ancre se résout en « /#contenu » et recharge l'accueil.
     Le href reste pour le sens du lien (et le clic milieu) ; le clic est géré par skipToContent(). -->
<a class="skip-link" href="#contenu" (click)="skipToContent($event)">Aller au contenu</a>
<app-header />
<!-- tabindex="-1" : focusable par programme (lien d'évitement, changement de page), mais hors de l'ordre de tabulation. -->
<main id="contenu" #main tabindex="-1">
  <!-- Le routeur insère ici le composant de la page courante. -->
  <router-outlet />
</main>
<app-footer />
<app-notification-host />
