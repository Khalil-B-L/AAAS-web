<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <!-- Titre avant le démarrage d'Angular ; ensuite AppTitleStrategy le remplace (nom : core/config/app-info.ts). -->
    <title>A.A.A.S</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Actualités et événements de l'Association d'amitié et d'action sociale (A.A.A.S)." />
    <!-- Couleur de la barre du navigateur sur mobile : vert de l'association (src/theme/_brand.scss). -->
    <meta name="theme-color" content="#0f5c2e" />
    <!-- Icônes tirées du logo (les deux mains), servies par le même site : rien à changer dans la CSP. -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- Aucune police ni feuille de style externe : la Content-Security-Policy ne l'autorise pas (ADR 0017). -->
  </head>
  <body>
    <app-root></app-root>
    <noscript>Ce site a besoin de JavaScript pour fonctionner.</noscript>
  </body>
</html>
